services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: LI_AT
        sync: false # the LinkedIn session cookie; set in the dashboard, never in the repo
      - key: DATABASE_URL
        sync: false # Neon's pooled connection string
      - key: SESSION_KEY
        sync: false # openssl rand -hex 32
      - key: RESEND_API_KEY
        sync: false # required in production; without it the app refuses to start
      - key: ABSTRACT_API_KEY
        sync: false # unset skips every phone check
      - key: NODE_ENV
        value: production
      - key: APP_ORIGIN
        value: https://linkedin-profile-api-c925.onrender.com # must match where the app is served
      - key: EMAIL_FROM
        value: LinkedIn Profile API <onboarding@resend.dev>
      - key: PHONE_VALIDATION_FAIL_MODE
        value: open # accept when the provider gives no verdict
      - key: AUTH_RATE_LIMIT_PER_HOUR
        value: '20'
      - key: PASSWORD_HASHER
        value: argon2
      - key: RATE_LIMIT_PER_MINUTE
        value: '10'
      - key: CACHE_TTL_SECONDS
        value: '900'
