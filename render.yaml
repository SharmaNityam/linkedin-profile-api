services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: LI_AT
        sync: false # the LinkedIn session cookie; set in the dashboard, never in the repo
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: '10'
      - key: CACHE_TTL_SECONDS
        value: '900'
      - key: SESSION_KEY
        sync: false # 64 hex chars, e.g. `openssl rand -hex 32`; set in the dashboard
      - key: BREVO_API_KEY
        sync: false # Brevo transactional-email API key; SMTP ports are blocked on this plan, set in the dashboard
      - key: EMAIL_FROM
        value: sharmanityam03@gmail.com
      - key: SMTP_USER
        sync: false # Gmail address that sends OTP codes; set in the dashboard
      - key: SMTP_PASS
        sync: false # Gmail app password; set in the dashboard
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '465'
      - key: APP_ORIGIN
        value: https://linkedin-profile-api-c925.onrender.com
      - key: ALLOWED_EMAIL_DOMAINS
        value: gmail.com,yahoo.com,outlook.com,myyahoo.com
      - key: ACCOUNTS_PER_IP
        value: '10'
      - key: ADMIN_EMAIL
        sync: false # optional shared tester login; set in the dashboard, or leave unset to disable POST /auth/login
      - key: ADMIN_PASSWORD
        sync: false # optional shared tester login; at least 12 characters; set in the dashboard
