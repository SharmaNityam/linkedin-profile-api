services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: LI_AT
        sync: false # set in the Render dashboard; never in the repo
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: CACHE_TTL_SECONDS
        value: "900"
      # Free instances have 512 MB; Chromium needs ~1 GB. Set to "true" on a starter plan.
      - key: BROWSER_FALLBACK
        value: "false"
