services:
  - type: web
    name: linkedin-profile-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: LI_AT
        sync: false # the LinkedIn session cookie; set in the dashboard, never in the repo
      - key: NODE_ENV
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: '10'
      - key: CACHE_TTL_SECONDS
        value: '900'
