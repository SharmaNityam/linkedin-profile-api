<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinkedIn Profile API</title>
<meta name="description" content="Turn a LinkedIn profile, company or activity URL into structured JSON. Built on LinkedIn's internal Voyager API." />
<meta name="color-scheme" content="dark light" />
<meta property="og:title" content="LinkedIn Profile API" />
<meta property="og:description" content="Turn a LinkedIn profile, company or activity URL into structured JSON. Built on LinkedIn's internal Voyager API." />
<meta property="og:url" content="https://linkedin-profile-api-c925.onrender.com/" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<header class="top">
  <div class="hdr">
    <a class="brand" href="/">LinkedIn Profile API</a>
    <nav aria-label="Resources">
      <span class="me" id="me" hidden></span>
      <a href="/docs">Docs</a><span class="sep">·</span><a href="https://github.com/SharmaNityam/linkedin-profile-api" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main id="main" data-state="landing">
  <div class="shell">
    <div class="rail rail-left">
      <nav class="sections" id="sections" aria-label="Sections" hidden></nav>
      <section class="recent" id="recent" hidden></section>
    </div>

    <div class="mid">
      <div class="hero" id="hero">
        <h1>LinkedIn Profile API</h1>
        <p>Turn a LinkedIn profile, company or activity URL into JSON.</p>
      </div>

      <form class="lookup" id="form" autocomplete="off">
        <label class="sr" for="url">LinkedIn profile, company or activity URL</label>
        <input id="url" name="url" type="text" placeholder="linkedin.com/in/username" spellcheck="false" inputmode="url" />
        <button class="btn" id="go" type="submit">Fetch</button>
      </form>

      <p class="try" id="try"></p>

      <p class="recent-row" id="recent-row" hidden></p>

      <form class="auth" id="auth" hidden></form>

      <div class="bar" id="bar" hidden>
        <div class="tabs" role="tablist" id="tabs" hidden>
          <button role="tab" aria-selected="true" data-tab="view" id="tab-view">Profile</button>
          <button role="tab" aria-selected="false" data-tab="json">JSON</button>
        </div>
        <span class="status" id="status" hidden></span>
      </div>

      <div class="card" id="view" hidden></div>
    </div>

    <div class="rail rail-right">
      <section class="statusbox" id="statusbox" hidden></section>
    </div>
  </div>
</main>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const form = $('#form'), input = $('#url'), go = $('#go'), view = $('#view');
  const mainEl = $('#main'), hero = $('#hero'), tryEl = $('#try');
  const statusEl = $('#status'), tabsEl = $('#tabs'), tabView = $('#tab-view'), bar = $('#bar');
  const authForm = $('#auth'), meEl = $('#me');
  const recentEl = $('#recent'), recentRow = $('#recent-row');
  const sectionsEl = $('#sections'), statusBox = $('#statusbox');

  let data = null, kind = 'profile', tab = 'view', uid = 0;
  let viewer = null, step = 'email', signInEmail = '', pendingUrl = null, authOpen = false;

  // Labelled by endpoint, not by path, so the line stays one short row.
  const EXAMPLES = [
    ['linkedin.com/in/sharmanityam', 'profile'],
    ['linkedin.com/company/anthropicresearch', 'company'],
    ['linkedin.com/in/sharmanityam/recent-activity/all/', 'posts'],
  ];
  const KIND_LABEL = { profile: 'Profile', company: 'Company', posts: 'Posts' };

  // ---- dates
  const fmt = (d) => d ? (d.month ? `${MONTHS[d.month - 1]} ${d.year}` : String(d.year)) : null;
  function range(a, b) {
    const s = fmt(a), e = b ? fmt(b) : (a ? 'Present' : null);
    if (!s) return '';
    return `${s} – ${e}${duration(a, b)}`;
  }
  // Inclusive month count between two partial dates; an absent end means "until now".
  function months(a, b) {
    const now = new Date();
    const sm = a.year * 12 + ((a.month ?? 1) - 1);
    const em = b ? b.year * 12 + ((b.month ?? 12) - 1) : now.getFullYear() * 12 + now.getMonth();
    return Math.max(0, em - sm + 1);
  }
  function spanDuration(a, b) {
    if (!a) return '';
    const m = months(a, b), y = Math.floor(m / 12), r = m % 12;
    return [y ? `${y} yr${y > 1 ? 's' : ''}` : '', r ? `${r} mo${r > 1 ? 's' : ''}` : ''].filter(Boolean).join(' ');
  }
  function duration(a, b) {
    if (!a) return '';
    const s = spanDuration(a, b);
    return s ? ` · ${s}` : '';
  }
  const AGO = [[60, 1, 's'], [3600, 60, 'min'], [86400, 3600, 'h'], [604800, 86400, 'd'], [2592000, 604800, 'w'], [31536000, 2592000, 'mo']];
  function ago(iso) {
    const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
    if (s < 45) return 'just now';
    const step = AGO.find(([limit]) => s < limit);
    return step ? `${Math.round(s / step[1])} ${step[2]} ago` : `${Math.round(s / 31536000)} yr ago`;
  }
  const exactDate = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: 'long', timeStyle: 'short' });
  const PROF = { ELEMENTARY: 'Elementary', LIMITED_WORKING: 'Limited working', PROFESSIONAL_WORKING: 'Professional working', FULL_PROFESSIONAL: 'Full professional', NATIVE_OR_BILINGUAL: 'Native / bilingual' };

  // ---- numbers
  const num = (n) => n.toLocaleString('en-US');
  const compact = (n) => new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
  const plural = (n, word) => n ? `${num(n)} ${word}${n === 1 ? '' : 's'}` : null;
  const dots = (parts) => parts.filter(Boolean).map(esc).join(' · ');
  const dotsHtml = (parts) => parts.filter(Boolean).join(' · ');

  // ---- renderers
  const initialOf = (name) => esc((name || '?').trim()[0] || '?');
  const srcset = (image) => image.variants?.length > 1 ? image.variants.map((v) => `${esc(v.url)} ${esc(v.width)}w`).join(', ') : '';
  // Wrapped image: skeleton until load, `fallback` HTML on error.
  function img({ image, alt = '', cls, eager = false, sizes, fallback, style = '' }) {
    const box = style ? ` style="${esc(style)}"` : '';
    if (!image?.url) return `<span class="img-wrap ${cls}"${box}>${fallback}</span>`;
    const ss = srcset(image);
    return `<span class="img-wrap ${cls}"${box} data-fallback="${esc(fallback)}"><span class="skel"></span><img data-img src="${esc(image.url)}"${ss ? ` srcset="${ss}" sizes="${esc(sizes)}"` : ''} alt="${esc(alt)}" loading="${eager ? 'eager' : 'lazy'}" decoding="async" referrerpolicy="no-referrer" /></span>`;
  }
  // A decorative initial (logos, whose name is already in the text beside them)
  // is hidden from assistive tech; the avatar has no such neighbour, so passing
  // `label` keeps it an image with an accessible name.
  const initialHtml = (name, label) => `<span class="initial" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${initialOf(name)}</span>`;
  const logo = (org, name) => img({ image: org?.logoUrl ? { url: org.logoUrl, variants: [] } : null, cls: 'logo', sizes: '40px', fallback: initialHtml(name) });

  function bindImages(root) {
    for (const el of root.querySelectorAll('img[data-img]:not([data-bound])')) {
      el.dataset.bound = '1';
      const wrap = el.parentElement;
      const loaded = () => wrap.querySelector('.skel')?.remove();
      const failed = () => { wrap.innerHTML = wrap.dataset.fallback || ''; };
      if (el.complete) { el.naturalWidth > 0 ? loaded() : failed(); continue; }
      el.addEventListener('load', loaded, { once: true });
      el.addEventListener('error', failed, { once: true });
    }
  }
  // The clamp is a line count, so text under 4 lines needs no toggle at all.
  function trimClamps(root) {
    for (const btn of root.querySelectorAll('[data-clamp]')) {
      const t = $(btn.dataset.clamp);
      if (t && t.scrollHeight <= t.clientHeight + 1) { t.dataset.clamped = 'false'; btn.remove(); }
    }
  }
  const orgLink = (org, name) => org?.linkedinUrl ? `<a href="${esc(org.linkedinUrl)}" rel="noopener" target="_blank">${esc(name)}</a>` : esc(name);
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };

  // Long free text is clamped to 4 lines behind a "Show more" toggle.
  const CLAMP_AT = 280;
  function desc(text, cls = 'desc') {
    if (!text) return '';
    if (text.length <= CLAMP_AT) return `<p class="${cls}">${esc(text)}</p>`;
    const id = `clamp-${++uid}`;
    return `<p class="${cls}" id="${id}" data-clamped="true">${esc(text)}</p><button class="more" type="button" data-clamp="#${id}">Show more</button>`;
  }

  // ---- grouping: consecutive positions at one company collapse into a single entry
  const expKey = (e) => e.company?.universalName ?? e.company?.linkedinUrl ?? (e.companyName ?? '').toLowerCase();
  function groupRuns(items, key) {
    const runs = [];
    for (const it of items) {
      const k = key(it), last = runs[runs.length - 1];
      if (k && last && last.key === k) last.items.push(it);
      else runs.push({ key: k, items: [it] });
    }
    return runs;
  }
  const startNum = (d) => d.year * 12 + ((d.month ?? 1) - 1);
  const endNum = (d) => d.year * 12 + ((d.month ?? 12) - 1);
  // Earliest start → latest end, or "still there" when any role is current.
  function totalDuration(items) {
    const starts = items.map((i) => i.startDate).filter(Boolean);
    if (!starts.length) return '';
    const start = starts.reduce((a, b) => (startNum(b) < startNum(a) ? b : a));
    const open = items.some((i) => i.isCurrent || (i.startDate && !i.endDate));
    const ends = items.map((i) => i.endDate).filter(Boolean);
    return spanDuration(start, open || !ends.length ? null : ends.reduce((a, b) => (endNum(b) > endNum(a) ? b : a)));
  }
  // The value every role in the group shares, or null when they differ.
  function shared(items, pick) {
    const values = new Set(items.map((i) => pick(i) ?? ''));
    const [only] = values;
    return values.size === 1 && only ? only : null;
  }

  function block(title, items, body, id) {
    if (!items?.length) return '';
    return `<section class="block pad"${id ? ` id="${id}"` : ''}><h2>${title}<span class="count">${items.length}</span></h2>${body}</section>`;
  }

  function renderTry() {
    tryEl.innerHTML = `Try: ${EXAMPLES.map(([url, label]) => `<button class="ex" type="button" data-example="${esc(url)}">${esc(label)}</button>`).join('<span class="sep">·</span>')}`;
  }

  // Landing centres the block and shows the pitch; results drop it and go top-aligned.
  function setState(next) {
    mainEl.dataset.state = next;
    hero.hidden = tryEl.hidden = next !== 'landing';
  }

  function renderProfile(p) {
    uid = 0;
    const facts = dots([p.location?.name, p.industry, p.isPremium ? 'Premium' : null]);

    // One position → a plain row; several at the same company → one entry with a role timeline.
    const position = (g) => {
      const first = g.items[0];
      if (g.items.length === 1) return `
      <li>${logo(first.company, first.companyName)}<div class="col">
        <p class="t">${esc(first.title)}${first.isCurrent ? '<span class="now">Now</span>' : ''}</p>
        <p class="o">${dotsHtml([orgLink(first.company, first.companyName ?? ''), esc(first.employmentType)])}</p>
        <p class="d">${dots([range(first.startDate, first.endDate), first.location])}</p>
        ${desc(first.description)}
      </div></li>`;
      const type = shared(g.items, (i) => i.employmentType), place = shared(g.items, (i) => i.location);
      const sub = dots([type, totalDuration(g.items), place]);
      return `
      <li>${logo(first.company, first.companyName)}<div class="col">
        <p class="t">${orgLink(first.company, first.companyName ?? '')}</p>
        ${sub ? `<p class="d">${sub}</p>` : ''}
        <ol class="roles">${g.items.map((e) => `
          <li>
            <p class="t">${esc(e.title)}${e.isCurrent ? '<span class="now">Now</span>' : ''}</p>
            ${!type && e.employmentType ? `<p class="o">${esc(e.employmentType)}</p>` : ''}
            <p class="d">${dots([range(e.startDate, e.endDate), place ? null : e.location])}</p>
            ${desc(e.description)}
          </li>`).join('')}</ol>
      </div></li>`;
    };

    const SKILL_CAP = 24, extra = p.skills.length - SKILL_CAP;
    const simple = (title, rows) => block(title, rows, `<ul class="timeline">${rows.map((r) => `
      <li><div class="col"><p class="t">${esc(r.title ?? r.name)}</p><p class="o">${esc(r.issuer ?? r.publisher ?? r.number ?? '')}</p>${desc(r.description)}</div></li>`).join('')}</ul>`);

    view.innerHTML = `
      <div class="pad" id="personal">
        <div class="identity">
          ${img({ image: p.profileImage, alt: p.fullName, cls: 'avatar', eager: true, sizes: '48px', fallback: initialHtml(p.fullName, p.fullName) })}
          <div class="who">
            <h1>${esc(p.fullName)}${p.pronouns ? `<span class="pronouns">${esc(p.pronouns)}</span>` : ''}</h1>
            ${p.headline ? `<p class="headline">${esc(p.headline)}</p>` : ''}
            ${facts ? `<p class="facts">${facts}</p>` : ''}
          </div>
        </div>
        <p class="links"><a href="${esc(p.url)}" rel="noopener" target="_blank">View on LinkedIn</a><span class="sep">·</span><button class="btn-text" type="button" data-copy-url="${esc(p.url)}">Copy link</button></p>
      </div>
      ${p.about ? `<section class="block pad" id="about"><h2>About</h2>${desc(p.about, 'body')}</section>` : ''}
      ${block('Experience', p.experience, `<ul class="timeline">${groupRuns(p.experience, expKey).map(position).join('')}</ul>`, 'experience')}
      ${block('Education', p.education, `<ul class="timeline">${p.education.map((e) => `
        <li>${logo(e.school, e.schoolName)}<div class="col">
          <p class="t">${orgLink(e.school, e.schoolName ?? '')}</p>
          <p class="o">${esc([e.degree, e.fieldOfStudy].filter(Boolean).join(', '))}</p>
          <p class="d">${dots([range(e.startDate, e.endDate).replace(/ · .*$/, ''), e.grade ? `Grade ${e.grade}` : null])}</p>
          ${desc(e.activities)}${desc(e.description)}
        </div></li>`).join('')}</ul>`, 'education')}
      ${block('Skills', p.skills, `<div class="chips">${p.skills.map((s, i) => `<span${i >= SKILL_CAP ? ' hidden' : ''}>${esc(s.name)}</span>`).join('')}</div>${extra > 0 ? `<button class="more" type="button" data-skills-more>Show ${extra} more</button>` : ''}`, 'skills')}
      ${block('Licenses &amp; certifications', p.certifications, `<ul class="timeline">${p.certifications.map((c) => `
        <li>${logo(c.organization, c.authority)}<div class="col">
          <p class="t">${c.url ? `<a href="${esc(c.url)}" rel="noopener" target="_blank">${esc(c.name)}</a>` : esc(c.name)}</p>
          <p class="o">${esc(c.authority ?? '')}</p>
          <p class="d">${dots([c.issuedAt ? `Issued ${fmt(c.issuedAt)}` : null, c.expiresAt ? `Expires ${fmt(c.expiresAt)}` : null, c.licenseNumber ? `No. ${c.licenseNumber}` : null])}</p>
        </div></li>`).join('')}</ul>`, 'certifications')}
      ${block('Languages', p.languages, `<dl class="kv">${p.languages.map((l) => `<dt>${esc(l.name)}</dt><dd>${esc(PROF[l.proficiency] ?? l.proficiency ?? '—')}</dd>`).join('')}</dl>`, 'languages')}
      ${block('Volunteering', p.volunteering, `<ul class="timeline">${p.volunteering.map((v) => `
        <li>${logo(v.organization, v.organizationName)}<div class="col">
          <p class="t">${esc(v.role)}</p>
          <p class="o">${dotsHtml([orgLink(v.organization, v.organizationName ?? ''), v.cause ? esc(v.cause.toLowerCase().replace(/_/g, ' ')) : null])}</p>
          <p class="d">${esc(range(v.startDate, v.endDate))}</p>
          ${desc(v.description)}
        </div></li>`).join('')}</ul>`)}
      ${simple('Projects', p.projects)}${simple('Honors &amp; awards', p.honors)}${simple('Publications', p.publications)}${simple('Courses', p.courses)}
    `;
    bindImages(view);
    trimClamps(view);
  }

  // ---- company
  function staffLine(c) {
    const r = c.staffCountRange;
    if (r) return `${num(r.start)}${r.end ? ` to ${num(r.end)}` : '+'} employees`;
    return c.staffCount != null ? `${num(c.staffCount)} employees` : null;
  }
  const place = (h) => h ? [h.city, h.region, h.country].filter(Boolean).join(', ') : null;

  function renderCompany(c) {
    uid = 0;
    const facts = dots([
      c.industries.join(', ') || null,
      c.companyType,
      staffLine(c),
      c.followerCount != null ? `${compact(c.followerCount)} followers` : null,
      place(c.headquarters),
      c.foundedYear ? `Founded ${c.foundedYear}` : null,
    ]);

    view.innerHTML = `
      <div class="pad" id="personal">
        <div class="identity">
          ${img({ image: c.logo, alt: c.name, cls: 'avatar org', eager: true, sizes: '48px', fallback: initialHtml(c.name, c.name) })}
          <div class="who">
            <h1>${esc(c.name)}<span class="kind">${esc(c.kind)}</span></h1>
            ${c.tagline ? `<p class="headline">${esc(c.tagline)}</p>` : ''}
            ${facts ? `<p class="facts">${facts}</p>` : ''}
          </div>
        </div>
        <p class="links">${c.websiteUrl ? `<a href="${esc(c.websiteUrl)}" rel="noopener nofollow" target="_blank">${esc(host(c.websiteUrl))}</a><span class="sep">·</span>` : ''}<a href="${esc(c.url)}" rel="noopener" target="_blank">View on LinkedIn</a></p>
      </div>
      ${c.description ? `<section class="block pad" id="about"><h2>About</h2>${desc(c.description, 'body')}</section>` : ''}
      ${block('Specialities', c.specialities, `<div class="chips">${c.specialities.map((s) => `<span>${esc(s)}</span>`).join('')}</div>`, 'details')}
    `;
    bindImages(view);
    trimClamps(view);
  }

  // ---- posts
  const REACTION = { LIKE: 'Like', PRAISE: 'Celebrate', EMPATHY: 'Support', APPRECIATION: 'Insightful', INTEREST: 'Curious', ENTERTAINMENT: 'Funny', MAYBE: 'Maybe' };
  function statsRow(p) {
    const open = p.url ? `<a class="open" href="${esc(p.url)}" rel="noopener" target="_blank">View post</a>` : '';
    if (!p.stats) return open ? `<div class="stats"><span></span>${open}</div>` : '';
    const s = p.stats;
    const breakdown = Object.entries(s.reactions).map(([k, v]) => `${REACTION[k] ?? k} ${num(v)}`).join(' · ');
    return `<div class="stats">
      <span${breakdown ? ` title="${esc(breakdown)}"` : ''}>${dots([plural(s.likes, 'like'), plural(s.comments, 'comment'), plural(s.shares, 'share')])}</span>
      ${open}
    </div>`;
  }
  const cellSizes = (n) => n === 1 ? '(max-width: 680px) 100vw, 640px' : n <= 4 ? '(max-width: 680px) 50vw, 320px' : '(max-width: 680px) 33vw, 213px';
  function media(p) {
    const n = p.images.length;
    // A lone image keeps its own proportions; a set is cropped into an even grid.
    const single = n === 1 ? p.images[0].variants.at(-1) : null;
    const grid = n ? `<div class="pimgs" data-n="${n}" data-cols="${n === 1 ? 1 : n <= 4 ? 2 : 3}">${p.images.map((im, i) => img({
      image: im, cls: 'cell', alt: `Post image ${i + 1}`, sizes: cellSizes(n),
      style: single ? `aspect-ratio:${single.width}/${single.height}` : '', fallback: '',
    })).join('')}</div>` : '';
    const art = p.article ? `<a class="article-card" href="${esc(p.article.url ?? '#')}" rel="noopener nofollow" target="_blank">
      <span>${esc(p.article.title ?? p.article.url ?? 'Article')}</span>
      ${p.article.url ? `<span class="a-h">${esc(host(p.article.url))}</span>` : ''}
    </a>` : '';
    return grid + art;
  }
  // A bare repost carries the original author in `author`; a repost with commentary
  // keeps the resharer there and nests the original under `reshared`.
  function author(p, reposted) {
    const a = p.author;
    const labels = [reposted ? 'reposted' : null, p.video ? 'video' : null].filter(Boolean);
    return `<div class="author">
      <div class="col">
        <p class="n">${a.linkedinUrl ? `<a href="${esc(a.linkedinUrl)}" rel="noopener" target="_blank">${esc(a.name)}</a>` : esc(a.name)}${labels.map((l) => `<span class="label">${l}</span>`).join('')}</p>
        ${a.headline ? `<p class="h">${esc(a.headline)}</p>` : ''}
      </div>
      <span class="when" title="${esc(exactDate(p.createdAt))}">${esc(ago(p.createdAt))}</span>
    </div>`;
  }
  function renderPosts(r) {
    uid = 0;
    view.innerHTML = `
      <div class="pad activity" id="personal">
        <a href="${esc(r.url)}" rel="noopener" target="_blank">${esc(r.url.replace(/^https:\/\/www\./, ''))}</a>
        <span class="count">${r.posts.length} of ${r.count} requested</span>
      </div>
      <div id="posts">${r.posts.map((p) => `
        <div class="post pad">
          ${author(p, p.isReshare && !p.reshared)}
          ${desc(p.text, 'ptext')}
          ${media(p)}
          ${p.reshared ? `<div class="quote">${author(p.reshared, false)}${desc(p.reshared.text, 'ptext')}${media(p.reshared)}</div>` : ''}
          ${statsRow(p)}
        </div>`).join('')}</div>`;
    bindImages(view);
    trimClamps(view);
  }

  // Tokenise before escaping; escaping first would break string detection.
  function highlight(json) {
    const re = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g;
    let out = '', last = 0, m;
    while ((m = re.exec(json))) {
      out += esc(json.slice(last, m.index));
      const t = m[0];
      if (t.startsWith('"')) out += t.endsWith(':') ? `<span class="j-k">${esc(t.slice(0, -1))}</span>:` : `<span class="j-s">${esc(t)}</span>`;
      else if (t === 'null') out += `<span class="j-null">${t}</span>`;
      else if (t === 'true' || t === 'false') out += `<span class="j-b">${t}</span>`;
      else out += `<span class="j-n">${t}</span>`;
      last = m.index + t.length;
    }
    return out + esc(json.slice(last));
  }
  // The signed rendition list is most of the payload and rarely what you want to
  // paste; every image keeps its `url`, which is the largest rendition anyway.
  function withoutVariants(value) {
    if (Array.isArray(value)) return value.map(withoutVariants);
    if (value && typeof value === 'object') {
      return Object.fromEntries(Object.entries(value).filter(([k]) => k !== 'variants').map(([k, v]) => [k, withoutVariants(v)]));
    }
    return value;
  }
  function renderJson(d) {
    view.innerHTML = `<div class="json-actions">
      <button class="btn-text" type="button" data-copy-json="trimmed">Copy</button>
      <button class="btn-text" type="button" data-copy-json="full">Copy full</button>
    </div><pre class="json">${highlight(JSON.stringify(d, null, 2))}</pre>`;
  }

  const RENDER = { profile: renderProfile, company: renderCompany, posts: renderPosts };
  function renderView() {
    if (!data) return;
    view.hidden = false;
    delete view.dataset.loading;
    tab === 'json' ? renderJson(data) : RENDER[kind](data);
    renderSections();
  }

  function setStatus(cls, text) { bar.hidden = false; statusEl.hidden = false; statusEl.className = `status ${cls}`; statusEl.textContent = text; }

  // The reserved height belongs to the loading state only, so the card does not
  // jump when the skeleton is swapped for the real thing.
  function showLoading() {
    view.hidden = false;
    view.dataset.loading = 'true';
    view.innerHTML = `<div class="pad">
      <div class="identity"><span class="skel avatar"></span><div class="who">
        <div class="skel skel-line" style="width:40%;height:20px"></div>
        <div class="skel skel-line" style="width:70%;margin-top:8px"></div>
        <div class="skel skel-line" style="width:30%;margin-top:8px"></div>
      </div></div>
      <p class="cold" id="cold" hidden>Still working. This runs on a free instance that sleeps when idle and can take up to a minute to wake.</p>
    </div>`;
    setTimeout(() => { const c = $('#cold'); if (c) c.hidden = false; }, 6000);
    renderSections();
  }
  function showError(status, body) {
    const e = body?.error ?? { code: `HTTP_${status}`, message: typeof body === 'string' ? body : 'The API returned an unexpected response.' };
    view.hidden = false;
    delete view.dataset.loading;
    view.innerHTML = `<div class="pad error"><p class="code">${esc(status)} · ${esc(e.code)}</p><p>${esc(e.message)}</p>${e.details ? `<pre class="snippet">${highlight(JSON.stringify(e.details, null, 2))}</pre>` : ''}</div>`;
    renderSections();
  }

  // ---- sign-in: an address, then the emailed code, then a line in the header
  function renderAuth() {
    meEl.hidden = !viewer;
    if (viewer) meEl.innerHTML = `${esc(viewer.email)}<span class="sep">·</span><button class="btn-text" type="button" data-auth="logout">Sign out</button><span class="sep">·</span>`;
    authForm.hidden = !!viewer || !authOpen;
    if (authForm.hidden) { authForm.innerHTML = ''; return; }
    authForm.innerHTML = step === 'code' ? `
      <h2 class="auth-title">Enter the code</h2>
      <p class="auth-note">Sent to ${esc(signInEmail)}</p>
      <div class="auth-row">
        <label class="sr" for="code">Six-digit code</label>
        <input id="code" name="code" type="text" placeholder="6-digit code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
        <button class="btn" type="submit">Verify</button>
      </div>
      <p class="auth-links"><button class="btn-text" type="button" data-auth="resend">Resend</button><span class="sep">·</span><button class="btn-text" type="button" data-auth="restart">Change email</button></p>` : `
      <h2 class="auth-title">Verify your email</h2>
      <p class="auth-note">We'll send a 6-digit code. No password, no account.</p>
      <div class="auth-row">
        <label class="sr" for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false" />
        <button class="btn quiet" type="submit">Send code</button>
      </div>`;
  }

  const authInput = () => $('input', authForm);
  function authError(text) {
    $('.auth-err', authForm)?.remove();
    if (!text) return;
    const p = document.createElement('p');
    p.className = 'auth-err';
    p.textContent = text;
    $('.auth-row', authForm).insertAdjacentElement('afterend', p);
  }
  function authFailed(res, body) {
    const e = body?.error;
    let msg = e?.message ?? `Request failed (${res.status}).`;
    // The per-address message already names the wait; the per-IP one does not.
    if (e?.code === 'RATE_LIMITED' && !/try again/i.test(msg)) {
      const secs = Number(e.details?.retryAfterSeconds ?? res.headers.get('retry-after'));
      if (Number.isFinite(secs) && secs > 0) msg += ` Try again in ${Math.ceil(secs / 60)} min.`;
    }
    authError(msg);
  }
  const postJson = (path, body) => fetch(path, {
    method: 'POST',
    headers: { 'content-type': 'application/json', accept: 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify(body),
  });
  const readBody = async (res) => { try { return await res.json(); } catch { return null; } };

  async function runAuth(work) {
    const btn = $('button[type=submit]', authForm);
    authError('');
    btn.disabled = true;
    try { await work(); } catch (err) { authError(String(err.message || err)); }
    finally { if (btn.isConnected) btn.disabled = false; }
  }

  const requestCode = (email) => runAuth(async () => {
    const res = await postJson('/auth/request-code', { email });
    const body = await readBody(res);
    if (!res.ok) return authFailed(res, body);
    signInEmail = email;
    step = 'code';
    renderAuth();
    authInput().focus();
  });

  const verifyCode = (code) => runAuth(async () => {
    const res = await postJson('/auth/verify', { email: signInEmail, code });
    const body = await readBody(res);
    if (!res.ok) return authFailed(res, body);
    viewer = body;
    step = 'email';
    signInEmail = '';
    authOpen = false;
    renderAuth();
    const next = pendingUrl;
    pendingUrl = null;
    next ? lookup(next) : input.focus();
  });

  async function signOut() {
    try { await fetch('/auth/logout', { method: 'POST', headers: { accept: 'application/json' }, credentials: 'same-origin' }); } catch {}
    viewer = null; step = 'email'; signInEmail = ''; pendingUrl = null; authOpen = false;
    results.clear();
    clearResults();
    renderAuth();
    input.focus();
  }

  async function loadViewer() {
    try {
      const res = await fetch('/auth/me', { headers: { accept: 'application/json' }, credentials: 'same-origin' });
      viewer = res.ok ? await res.json() : null;
    } catch { viewer = null; }
    renderAuth();
  }

  // Needing an identity is a prompt, not a failure: the landing block stays put,
  // keeps the URL, and the card below it collects the address.
  function promptSignIn(url) {
    viewer = null; pendingUrl = url; step = 'email'; authOpen = true;
    clearResults();
    renderAuth();
    authInput().focus();
  }

  // Which endpoint a pasted URL belongs to. Company, school and showcase pages
  // are one lookup; an activity feed is another; everything else is a member.
  function kindOf(raw) {
    const s = raw.trim().toLowerCase();
    if (/\/(company|school|showcase)\/[^/\s]/.test(s)) return 'company';
    if (/\/in\/[^/\s]+\/recent-activity/.test(s) || /(^|\/)posts(\/|$)/.test(s)) return 'posts';
    return 'profile';
  }
  const ENDPOINT = {
    profile: (u) => `/v1/profile?url=${encodeURIComponent(u)}`,
    company: (u) => `/v1/company?url=${encodeURIComponent(u)}`,
    posts: (u) => `/v1/posts?url=${encodeURIComponent(u)}&count=10`,
  };

  const took = (ms) => ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`;
  // "cached", or "cached<sep>4 min" once the entry has an age worth naming.
  function cachedFor(meta, sep = ' ') {
    if (!meta?.cached) return null;
    const min = Math.round((Date.now() - Date.parse(meta.fetchedAt)) / 60000);
    if (!Number.isFinite(min) || min < 1) return 'cached';
    const age = min < 60 ? `${min} min` : min < 1440 ? `${Math.round(min / 60)} h` : `${Math.round(min / 1440)} d`;
    return `cached${sep}${age}`;
  }

  // One key per page: the same URL typed with or without the scheme, the www
  // host or a trailing slash is one entry.
  const normalise = (raw) => raw.trim().replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/\/+$/, '').toLowerCase();

  // Everything fetched this session, so Back and Forward re-render instead of refetching.
  const results = new Map();

  const RECENT_KEY = 'recent', RECENT_MAX = 20;
  function readRecent() {
    try {
      const list = JSON.parse(localStorage.getItem(RECENT_KEY) ?? '[]');
      return Array.isArray(list) ? list.filter((r) => r && typeof r.url === 'string') : [];
    } catch { return []; }
  }
  function writeRecent(list) {
    try { localStorage.setItem(RECENT_KEY, JSON.stringify(list)); } catch {}
    renderRecent();
  }
  // A repost by someone else opens the list; the account itself is the first
  // author who is not resharing.
  const postsName = (r) => r.posts.find((p) => !p.isReshare)?.author.name ?? r.posts[0]?.author.name ?? r.publicIdentifier;
  const LABEL_OF = {
    profile: (d) => d.fullName,
    company: (d) => d.name,
    posts: (d) => `Posts · ${postsName(d)}`,
  };
  function remember(url, k, d) {
    const entry = { url, kind: k, label: LABEL_OF[k](d) || url, at: new Date().toISOString() };
    writeRecent([entry, ...readRecent().filter((r) => r.url !== url)].slice(0, RECENT_MAX));
  }
  const recentLink = (r) => `<a href="?url=${encodeURIComponent(r.url)}" data-recent="${esc(r.url)}">${esc(r.label)}</a>`;
  const ROW_MAX = 5;
  function renderRecent() {
    const list = readRecent();
    recentEl.hidden = recentRow.hidden = !list.length;
    if (!list.length) { recentEl.innerHTML = recentRow.innerHTML = ''; return; }
    recentRow.innerHTML = `Recent: ${list.slice(0, ROW_MAX).map(recentLink).join('<span class="sep">·</span>')}`;
    recentEl.innerHTML = `<h2 class="panel-h">Recent</h2>
      <ul class="quiet">${list.map((r) => `<li>${recentLink(r)}<span class="t">${esc(ago(r.at))}</span></li>`).join('')}</ul>
      <p class="panel-foot"><button class="btn-text" type="button" data-recent-clear>Clear</button></p>`;
  }

  const statusLine = (hit) => dots([String(hit.status), took(hit.ms), cachedFor(hit.data.meta)]);

  // The right rail carries what the tabs row shows inline on a narrow screen,
  // plus the actions that belong to the request rather than to the result.
  function renderStatusBox(hit) {
    statusBox.hidden = !hit;
    delete statusEl.dataset.mirrored;
    if (!hit) { statusBox.innerHTML = ''; return; }
    statusEl.dataset.mirrored = 'true';
    const cached = cachedFor(hit.data.meta, ' · ');
    statusBox.innerHTML = `<h2 class="panel-h">Status</h2>
      <ul class="quiet">
        <li><span>HTTP</span><span class="t">${esc(hit.status)}</span></li>
        <li><span>Time</span><span class="t">${esc(took(hit.ms))}</span></li>
        ${cached ? `<li><span>Cache</span><span class="t">${esc(cached)}</span></li>` : ''}
      </ul>
      <ul class="quiet actions">
        <li><button class="btn-text" type="button" data-copy-json="full">Copy JSON</button></li>
        <li><button class="btn-text" type="button" data-copy-json="trimmed">Copy trimmed</button></li>
        ${hit.data.url ? `<li><a href="${esc(hit.data.url)}" rel="noopener" target="_blank">View on LinkedIn</a></li>` : ''}
      </ul>`;
  }

  // ---- the left rail's index of the result on screen
  const SECTION_IDS = ['personal', 'about', 'experience', 'education', 'skills', 'certifications', 'languages', 'posts', 'details'];
  const HEAD_LABEL = { profile: 'Personal', company: 'Overview', posts: 'Activity' };
  // A section is named by its own heading; the two that have none are named
  // after what they hold.
  function sectionLabel(el) {
    const h2 = $('h2', el);
    if (h2) return h2.firstChild.textContent.trim();
    return el.id === 'personal' ? HEAD_LABEL[kind] : 'Posts';
  }

  let observer = null, visible = new Set(), order = [];
  function setActive(id) {
    for (const a of sectionsEl.querySelectorAll('a')) a.setAttribute('aria-current', String(a.dataset.jump === id));
  }
  function renderSections() {
    observer?.disconnect();
    visible = new Set();
    const els = [...view.querySelectorAll('[id]')].filter((el) => SECTION_IDS.includes(el.id));
    order = els.map((el) => el.id);
    sectionsEl.hidden = els.length < 2;
    if (sectionsEl.hidden) { sectionsEl.innerHTML = ''; return; }
    sectionsEl.innerHTML = `<h2 class="panel-h">Sections</h2>
      <ul class="quiet">${els.map((el) => `<li><a href="#${el.id}" data-jump="${el.id}">${esc(sectionLabel(el))}</a></li>`).join('')}</ul>`;
    setActive(order[0]);
    // The section being read is the lowest one reaching into the top of the
    // viewport, so a section scrolling out yields to the one taking its place.
    observer = new IntersectionObserver((entries) => {
      for (const e of entries) e.isIntersecting ? visible.add(e.target.id) : visible.delete(e.target.id);
      const active = order.filter((id) => visible.has(id)).pop();
      if (active) setActive(active);
    }, { rootMargin: '0px 0px -60% 0px' });
    for (const el of els) observer.observe(el);
  }

  function showKind() {
    tabView.textContent = KIND_LABEL[kind];
    for (const b of tabsEl.children) b.setAttribute('aria-selected', String(b.dataset.tab === 'view'));
  }
  // Back to the landing block: no result, no status, no tabs.
  function clearResults() {
    data = null;
    view.hidden = true; view.innerHTML = ''; delete view.dataset.loading;
    bar.hidden = true; statusEl.hidden = true; tabsEl.hidden = true;
    renderStatusBox(null); renderSections();
    setState('landing');
  }
  // Puts a stored result back on screen, request free.
  function restore(url, hit) {
    input.value = url;
    kind = hit.kind; data = hit.data; tab = 'view';
    showKind();
    setState('results'); tabsEl.hidden = false;
    setStatus('', statusLine(hit));
    renderStatusBox(hit);
    renderView();
  }

  // `mode` is how the lookup enters the history: a submit pushes, the initial
  // deep link replaces, and a Back that has to refetch touches nothing.
  async function lookup(raw, mode = 'push') {
    const url = raw.trim();
    if (!url) { input.focus(); return; }
    input.value = url;
    if (!viewer) { promptSignIn(url); return; }
    const key = normalise(url);
    kind = kindOf(url);
    const entry = `?url=${encodeURIComponent(url)}`;
    if (mode === 'push') history.pushState({ url }, '', entry);
    else if (mode === 'replace') history.replaceState({ url }, '', entry);

    data = null; tab = 'view'; go.disabled = true;
    showKind();
    setState('results'); tabsEl.hidden = true;
    setStatus('', 'Fetching…');
    renderStatusBox(null);
    showLoading();
    const t0 = performance.now();
    try {
      const res = await fetch(ENDPOINT[kind](url), { headers: { accept: 'application/json' }, credentials: 'same-origin' });
      const text = await res.text();
      let body; try { body = JSON.parse(text); } catch { body = text; }
      const ms = Math.round(performance.now() - t0);
      if (res.status === 401) { promptSignIn(url); return; }
      if (!res.ok) {
        setStatus('err', `${res.status} · ${took(ms)}`);
        showError(res.status, body);
        return;
      }
      data = body;
      const hit = { kind, data: body, status: res.status, ms, at: new Date().toISOString() };
      results.set(key, hit);
      remember(key, kind, body);
      setStatus('', statusLine(hit));
      renderStatusBox(hit);
      tabsEl.hidden = false;
      renderView();
    } catch (err) {
      setStatus('err', 'Network error');
      showError('—', { error: { code: 'NETWORK', message: String(err.message || err) } });
    } finally { go.disabled = false; }
  }

  // ---- wiring
  form.addEventListener('submit', (e) => { e.preventDefault(); lookup(input.value); });
  // Back and Forward replay the map; only a URL this session never fetched
  // goes to the network.
  window.addEventListener('popstate', (e) => {
    const url = e.state?.url ?? new URLSearchParams(location.search).get('url');
    if (!url) { input.value = ''; clearResults(); return; }
    const hit = results.get(normalise(url));
    hit ? restore(url, hit) : lookup(url, 'none');
  });
  authForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const value = authInput().value.trim();
    if (!value) { authInput().focus(); return; }
    step === 'code' ? verifyCode(value) : requestCode(value);
  });
  for (const b of tabsEl.children) b.addEventListener('click', () => {
    tab = b.dataset.tab;
    for (const x of tabsEl.children) x.setAttribute('aria-selected', String(x === b));
    renderView();
  });
  async function flash(btn, text) {
    const label = btn.dataset.label ?? (btn.dataset.label = btn.textContent);
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = label; }, 1500);
    } catch {}
  }
  // Delegated so re-rendered markup needs no re-binding.
  document.addEventListener('click', (e) => {
    const auth = e.target.closest('[data-auth]');
    if (auth) {
      const act = auth.dataset.auth;
      if (act === 'logout') signOut();
      else if (act === 'resend') requestCode(signInEmail);
      else { step = 'email'; renderAuth(); authInput().focus(); }
      return;
    }
    const recent = e.target.closest('[data-recent]');
    // A modified click is the browser's to handle: it opens the deep link.
    if (recent && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); lookup(recent.dataset.recent); return; }
    if (e.target.closest('[data-recent-clear]')) { writeRecent([]); return; }
    const jump = e.target.closest('[data-jump]');
    if (jump) { e.preventDefault(); $(`#${jump.dataset.jump}`)?.scrollIntoView({ block: 'start' }); return; }
    const example = e.target.closest('[data-example]');
    if (example) { lookup(example.dataset.example); return; }
    const clamp = e.target.closest('[data-clamp]');
    if (clamp) { const t = $(clamp.dataset.clamp); if (t) t.dataset.clamped = 'false'; clamp.remove(); return; }
    const more = e.target.closest('[data-skills-more]');
    if (more) { for (const chip of more.previousElementSibling.querySelectorAll('span[hidden]')) chip.hidden = false; more.remove(); return; }
    const json = e.target.closest('[data-copy-json]');
    if (json) {
      const full = json.dataset.copyJson === 'full';
      flash(json, JSON.stringify(full ? data : withoutVariants(data), null, 2));
      return;
    }
    const copyUrl = e.target.closest('[data-copy-url]');
    if (copyUrl) flash(copyUrl, copyUrl.dataset.copyUrl);
  });
  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName ?? '');
    if (e.key === '/' && !typing && !e.metaKey && !e.ctrlKey && !e.altKey) { e.preventDefault(); input.focus(); input.select(); }
    else if (e.key === 'Escape') { (typing ? document.activeElement : input).value = ''; }
  });

  renderTry();
  renderRecent();
  const initial = new URLSearchParams(location.search).get('url');
  if (initial) input.value = initial;
  loadViewer().then(() => {
    if (initial) lookup(initial, 'replace');
    else input.focus();
  });
})();
</script>
</body>
</html>
