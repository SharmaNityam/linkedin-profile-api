<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LinkedIn Profile API</title>
<meta name="description" content="Turn a LinkedIn profile URL into structured JSON. Built on LinkedIn's internal Voyager API." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0d10;
    --surface: #12151a;
    --surface-2: #171b21;
    --border: #232830;
    --border-strong: #2f3641;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --faint: #5c6470;
    --accent: #f5b942;
    --accent-ink: #1a1300;
    --accent-dim: rgba(245, 185, 66, 0.14);
    --ok: #5fd39a;
    --err: #ff6b6b;
    --display: "Space Grotesk", "Inter", system-ui, sans-serif;
    --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input { font: inherit; color: inherit; }
  code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* ---- shell ---- */
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 24px 80px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 600; letter-spacing: -0.01em; text-decoration: none; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  nav.links { display: flex; gap: 6px; }
  nav.links a {
    text-decoration: none; color: var(--muted); font-size: 13.5px; padding: 6px 10px; border-radius: 6px;
  }
  nav.links a:hover { color: var(--text); background: var(--surface-2); }

  form.lookup {
    margin-top: 32px; display: flex; gap: 10px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; padding: 6px;
    transition: border-color .15s, box-shadow .15s;
  }
  form.lookup:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
  form.lookup .prefix { display: flex; align-items: center; padding-left: 12px; color: var(--faint); font-family: var(--mono); font-size: 13px; white-space: nowrap; }
  form.lookup input {
    flex: 1; min-width: 0; background: transparent; border: 0; padding: 10px 6px; font-family: var(--mono); font-size: 14px;
  }
  form.lookup input::placeholder { color: var(--faint); }
  form.lookup input:focus { outline: none; }
  .btn {
    border: 1px solid transparent; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); white-space: nowrap; transition: transform .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .6; cursor: progress; }

  .bar { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; min-height: 30px; }

  /* ---- account panel ---- */
  aside.auth { margin-top: 24px; padding: 14px 16px; }
  .auth-title { font-family: var(--display); font-weight: 600; font-size: 14.5px; margin: 0; }
  .auth-help { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .auth-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .auth-form input {
    flex: 1 1 190px; min-width: 0; background: var(--bg); border: 1px solid var(--border-strong);
    border-radius: 8px; padding: 9px 12px; font-size: 14px;
  }
  .auth-form input::placeholder { color: var(--faint); }
  .auth-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .auth-form input.code { flex: 0 1 150px; font-family: var(--mono); letter-spacing: .26em; }
  .btn.ghost { background: none; border-color: var(--border-strong); color: var(--text); font-weight: 500; }
  .btn.ghost:hover { filter: none; border-color: var(--faint); }
  .auth-msg { margin: 10px 0 0; font-size: 13px; color: var(--err); }
  .auth-msg.note { color: var(--ok); }
  .auth-skel { display: block; height: 18px; width: 240px; }
  .auth-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .auth-line .auth-email { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .auth-line .spacer { flex: 1; }
  .auth-link, .auth-toggle { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
  .auth-link { text-decoration: underline; text-underline-offset: 3px; }
  .auth-link:hover, .auth-toggle:hover { color: var(--text); }
  aside.auth button[disabled] { opacity: .6; cursor: progress; }
  .auth-more { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .18s ease; }
  aside.auth.is-collapsed .auth-more { grid-template-rows: 0fr; }
  .auth-more > div { overflow: hidden; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  /* images: wrap = skeleton until load, then fade in; fallback on error */
  .img-wrap { position: relative; overflow: hidden; background: var(--surface-2); display: block; }
  .img-wrap > .skel { position: absolute; inset: 0; border-radius: 0; }
  .img-wrap > img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .15s ease-out; }
  .img-wrap.is-loaded > .skel { display: none; }
  .img-wrap.is-loaded > img { opacity: 1; }
  .img-wrap > .initial { position: absolute; inset: 0; display: grid; place-items: center; color: var(--faint); font-family: var(--display); font-weight: 600; }

  /* top card */
  .banner { aspect-ratio: 4 / 1; border-bottom: 1px solid var(--border); }
  .banner.is-fallback { background: var(--surface-2); }
  .identity { padding: 0 24px 22px; position: relative; }
  .avatar { width: 88px; height: 88px; border-radius: 50%; border: 4px solid var(--surface); margin-top: -44px; font-size: 32px; }
  .avatar > img { object-fit: cover; }
  .logo { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border); }
  .logo > img { object-fit: contain; }
  .logo > .initial { font-size: 16px; }
  .identity h2 { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -0.02em; margin: 12px 0 2px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .identity h2 small { font-family: var(--body); font-weight: 400; font-size: 13px; color: var(--muted); }
  .headline { margin: 0; font-size: 15.5px; }
  .facts { margin: 8px 0 0; color: var(--muted); font-size: 13.5px; display: flex; gap: 6px; flex-wrap: wrap; }
  .facts span + span::before { content: "·"; margin-right: 6px; color: var(--faint); }
  .about { margin: 18px 0 0; padding-top: 18px; border-top: 1px solid var(--border); white-space: pre-wrap; color: #cfd3d9; font-size: 14.5px; }
  .about[data-clamped="true"] { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .more { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 6px 0 0; font-size: 13px; font-weight: 500; }

  /* sections */
  section.block { padding: 20px 24px; border-top: 1px solid var(--border); }
  section.block > h3 {
    margin: 0 0 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: -0.01em;
  }
  section.block > h3 .count { color: var(--muted); font-weight: 500; font-size: 13px; margin-left: 8px; font-family: var(--body); }

  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 12px 0; position: relative; }
  .timeline li + li { border-top: 1px solid var(--border); }
  .timeline .t { font-weight: 600; font-size: 15px; margin: 0; }
  .timeline .o { color: #cfd3d9; margin: 1px 0 0; font-size: 14px; }
  .timeline .o a { color: inherit; text-decoration: none; }
  .timeline .o a:hover { color: var(--accent); }
  .timeline .d { color: var(--muted); font-size: 13px; margin: 3px 0 0; font-family: var(--mono); }
  .timeline .desc { margin: 8px 0 0; color: #b9bec6; font-size: 14px; white-space: pre-wrap; }
  .now { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-dim); border-radius: 4px; padding: 2px 6px; margin-left: 8px; vertical-align: middle; font-family: var(--body); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips span { border: 1px solid var(--border-strong); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; }

  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  .kv dt { color: var(--muted); font-size: 13.5px; }
  .kv dd { margin: 0; font-size: 13.5px; }
  .level { display: inline-block; height: 6px; width: 60px; border-radius: 3px; background: var(--border-strong); vertical-align: middle; margin-left: 10px; overflow: hidden; }
  .level i { display: block; height: 100%; background: var(--accent); }

  /* status pill */
  .pill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12.5px; border-radius: 999px; padding: 4px 10px 4px 8px; border: 1px solid var(--border-strong); }
  /* `display` on .pill would otherwise beat the UA's [hidden] rule, leaving an empty pill floating there. */
  .pill[hidden] { display: none; }
  .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .pill.ok::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .pill.err::before { background: var(--err); }
  .pill.busy::before { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  pre.snippet { margin: 0; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; overflow-x: auto; white-space: pre; line-height: 1.55; }
  .snippet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .copy { background: none; border: 1px solid var(--border-strong); color: var(--muted); border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; }
  .copy:hover { color: var(--text); border-color: var(--faint); }
  .copy[data-done="true"] { color: var(--ok); border-color: var(--ok); }

  .tabs { display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 2px; }
  .tabs button { background: none; border: 0; border-radius: 6px; padding: 5px 12px; color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 500; }
  .tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); }

  /* json view */
  .json { padding: 16px 20px; margin: 0; background: var(--surface); overflow: auto; max-height: 78vh; line-height: 1.55; font-size: 12.5px; }
  .j-k { color: #9fb7ff; } .j-s { color: #cde5b3; } .j-n { color: var(--accent); } .j-b { color: #f2a2ff; } .j-null { color: var(--faint); }
  .json-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--border); color: var(--muted); font-size: 13px; }

  /* states */
  .empty { padding: 48px 24px; text-align: center; color: var(--muted); }
  .empty .glyph { font-family: var(--mono); color: var(--faint); font-size: 13px; margin-bottom: 8px; }
  .error { padding: 24px; }
  .error code { color: var(--err); }
  .error p { margin: 6px 0 0; color: #cfd3d9; }
  .skel { background: linear-gradient(90deg, var(--surface-2) 25%, #1d222a 37%, var(--surface-2) 63%); background-size: 400% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
  @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: 0 0 } }
  .skel-banner { aspect-ratio: 4 / 1; border-radius: 0; }
  .skel-wrap { padding: 0 24px 24px; display: grid; gap: 12px; }
  .skel-avatar { width: 88px; height: 88px; border-radius: 50%; margin-top: -44px; border: 4px solid var(--surface); }
  .cold { padding: 0 24px 20px; color: var(--muted); font-size: 13px; }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .skel, .pill.busy::before { animation: none; }
    .img-wrap > img, .auth-more { transition: none; }
  }
  @media (max-width: 640px) {
    form.lookup { flex-direction: column; }
    form.lookup .prefix { display: none; }
    .identity, section.block { padding-left: 18px; padding-right: 18px; }
    .auth-form input, .auth-form input.code { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">LinkedIn Profile API</a>
    <nav class="links" aria-label="Resources">
      <a href="/docs">Docs</a>
      <a href="https://github.com/SharmaNityam/linkedin-profile-api" rel="noopener">GitHub</a>
    </nav>
  </header>

  <aside class="card auth" id="auth" aria-label="Account"></aside>

  <form class="lookup" id="form" autocomplete="off">
    <label class="sr" for="url">LinkedIn profile URL</label>
    <input id="url" name="url" type="text" placeholder="https://www.linkedin.com/in/username" spellcheck="false" inputmode="url" />
    <button class="btn" id="go" type="submit">Fetch</button>
  </form>

  <div class="bar">
    <span class="pill" id="status" hidden></span>
    <div class="tabs" role="tablist" id="tabs" hidden>
      <button role="tab" aria-selected="true" data-tab="profile">Profile</button>
      <button role="tab" aria-selected="false" data-tab="json">JSON</button>
    </div>
  </div>

  <main id="main">
    <div class="card" id="view"><div class="empty">Enter a LinkedIn profile URL.</div></div>
  </main>
</div>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const form = $('#form'), input = $('#url'), go = $('#go'), view = $('#view');
  const statusEl = $('#status'), tabsEl = $('#tabs'), authEl = $('#auth');

  let profile = null, tab = 'profile';

  // ---- dates
  const fmt = (d) => d ? (d.month ? `${MONTHS[d.month - 1]} ${d.year}` : String(d.year)) : null;
  function range(a, b) {
    const s = fmt(a), e = b ? fmt(b) : (a ? 'Present' : null);
    if (!s) return '';
    return `${s} – ${e}${duration(a, b)}`;
  }
  function duration(a, b) {
    if (!a) return '';
    const now = new Date();
    const sm = a.year * 12 + ((a.month ?? 1) - 1);
    const em = b ? b.year * 12 + ((b.month ?? 12) - 1) : now.getFullYear() * 12 + now.getMonth();
    const m = Math.max(0, em - sm + 1);
    const y = Math.floor(m / 12), r = m % 12;
    const parts = [y ? `${y} yr${y > 1 ? 's' : ''}` : '', r ? `${r} mo${r > 1 ? 's' : ''}` : ''].filter(Boolean);
    return parts.length ? ` · ${parts.join(' ')}` : '';
  }
  const PROF = { ELEMENTARY: [1, 'Elementary'], LIMITED_WORKING: [2, 'Limited working'], PROFESSIONAL_WORKING: [3, 'Professional working'], FULL_PROFESSIONAL: [4, 'Full professional'], NATIVE_OR_BILINGUAL: [5, 'Native / bilingual'] };

  // ---- renderers
  const initialOf = (name) => esc((name || '?').trim()[0] || '?');
  const srcset = (image) => image.variants?.length > 1 ? image.variants.map((v) => `${esc(v.url)} ${esc(v.width)}w`).join(', ') : '';
  // Wrapped image: skeleton until `load`, fade in, fallback on `error`. `fallback` is the HTML to show on error.
  function img({ image, alt = '', cls, eager = false, sizes, fallback }) {
    if (!image?.url) return `<span class="img-wrap ${cls} is-loaded">${fallback}</span>`;
    const ss = srcset(image);
    return `<span class="img-wrap ${cls}" data-fallback="${esc(fallback)}"><span class="skel"></span><img data-img src="${esc(image.url)}"${ss ? ` srcset="${ss}" sizes="${esc(sizes)}"` : ''} alt="${esc(alt)}" loading="${eager ? 'eager' : 'lazy'}" decoding="async" referrerpolicy="no-referrer" /></span>`;
  }
  // A decorative initial (logos, whose name is already in the text beside them)
  // is hidden from assistive tech; the avatar has no such neighbour, so passing
  // `label` keeps it an image with an accessible name.
  const initialHtml = (name, label) => `<span class="initial" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'}>${initialOf(name)}</span>`;
  const logo = (org, name) => img({ image: org?.logoUrl ? { url: org.logoUrl, variants: [] } : null, cls: 'logo', sizes: '44px', fallback: initialHtml(name) });

  function bindImages(root) {
    for (const el of root.querySelectorAll('img[data-img]:not([data-bound])')) {
      el.dataset.bound = '1';
      const wrap = el.parentElement;
      const loaded = () => wrap.classList.add('is-loaded');
      const failed = () => { wrap.innerHTML = wrap.dataset.fallback || ''; wrap.classList.add('is-loaded', 'is-fallback'); };
      if (el.complete) { el.naturalWidth > 0 ? loaded() : failed(); continue; }
      el.addEventListener('load', loaded, { once: true });
      el.addEventListener('error', failed, { once: true });
    }
  }
  const orgLink = (org, name) => org?.linkedinUrl ? `<a href="${esc(org.linkedinUrl)}" rel="noopener" target="_blank">${esc(name)}</a>` : esc(name);

  function block(key, title, items, body) {
    if (!items?.length) return '';
    return `<section class="block"><h3>${title}<span class="count">${items.length}</span></h3>${body}</section>`;
  }

  function renderProfile(p) {
    const name = esc(p.fullName);
    const facts = [p.location?.name, p.industry, p.isPremium ? 'Premium' : null].filter(Boolean);
    const about = p.about ? `<p class="about" id="about" data-clamped="${p.about.length > 320}">${esc(p.about)}</p>${p.about.length > 320 ? '<button class="more" type="button" id="more">Show more</button>' : ''}` : '';

    const experience = block('experience', 'Experience', p.experience, `<ul class="timeline">${p.experience.map((e) => `
      <li>${logo(e.company, e.companyName)}<div>
        <p class="t">${esc(e.title)}${e.isCurrent ? '<span class="now">Now</span>' : ''}</p>
        <p class="o">${orgLink(e.company, e.companyName ?? '')}${e.employmentType ? ` · ${esc(e.employmentType)}` : ''}</p>
        <p class="d">${esc(range(e.startDate, e.endDate))}${e.location ? ` · ${esc(e.location)}` : ''}</p>
        ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ''}
      </div></li>`).join('')}</ul>`);

    const education = block('education', 'Education', p.education, `<ul class="timeline">${p.education.map((e) => `
      <li>${logo(e.school, e.schoolName)}<div>
        <p class="t">${orgLink(e.school, e.schoolName ?? '')}</p>
        <p class="o">${esc([e.degree, e.fieldOfStudy].filter(Boolean).join(', '))}</p>
        <p class="d">${esc(range(e.startDate, e.endDate).replace(/ · .*$/, ''))}${e.grade ? ` · Grade ${esc(e.grade)}` : ''}</p>
        ${e.activities ? `<p class="desc">${esc(e.activities)}</p>` : ''}
        ${e.description ? `<p class="desc">${esc(e.description)}</p>` : ''}
      </div></li>`).join('')}</ul>`);

    const skills = block('skills', 'Skills', p.skills, `<div class="chips">${p.skills.map((s) => `<span>${esc(s.name)}</span>`).join('')}</div>`);

    const certs = block('certifications', 'Licenses & certifications', p.certifications, `<ul class="timeline">${p.certifications.map((c) => `
      <li>${logo(c.organization, c.authority)}<div>
        <p class="t">${c.url ? `<a href="${esc(c.url)}" rel="noopener" target="_blank" style="text-decoration:none">${esc(c.name)} ↗</a>` : esc(c.name)}</p>
        <p class="o">${esc(c.authority ?? '')}</p>
        <p class="d">${[c.issuedAt ? `Issued ${fmt(c.issuedAt)}` : '', c.expiresAt ? `Expires ${fmt(c.expiresAt)}` : '', c.licenseNumber ? `No. ${c.licenseNumber}` : ''].filter(Boolean).map(esc).join(' · ')}</p>
      </div></li>`).join('')}</ul>`);

    const languages = block('languages', 'Languages', p.languages, `<dl class="kv">${p.languages.map((l) => {
      const [n, label] = PROF[l.proficiency] ?? [0, l.proficiency ?? '-'];
      return `<dt>${esc(l.name)}</dt><dd>${esc(label)}<span class="level" aria-hidden="true"><i style="width:${n * 20}%"></i></span></dd>`;
    }).join('')}</dl>`);

    const vol = block('volunteering', 'Volunteering', p.volunteering, `<ul class="timeline">${p.volunteering.map((v) => `
      <li>${logo(v.organization, v.organizationName)}<div>
        <p class="t">${esc(v.role)}</p>
        <p class="o">${orgLink(v.organization, v.organizationName ?? '')}${v.cause ? ` · ${esc(v.cause.toLowerCase().replace(/_/g, ' '))}` : ''}</p>
        <p class="d">${esc(range(v.startDate, v.endDate))}</p>
        ${v.description ? `<p class="desc">${esc(v.description)}</p>` : ''}
      </div></li>`).join('')}</ul>`);

    const simple = (key, title, rows) => block(key, title, rows, `<ul class="timeline">${rows.map((r) => `<li>${logo(null, '·')}<div><p class="t">${esc(r.title ?? r.name)}</p><p class="o">${esc(r.issuer ?? r.publisher ?? r.number ?? '')}</p>${r.description ? `<p class="desc">${esc(r.description)}</p>` : ''}</div></li>`).join('')}</ul>`);

    view.innerHTML = `
      ${img({ image: p.backgroundImage, cls: 'banner', eager: true, sizes: '(max-width: 800px) 100vw, 800px', fallback: '' })}
      <div class="identity">
        ${img({ image: p.profileImage, alt: p.fullName, cls: 'avatar', eager: true, sizes: '88px', fallback: initialHtml(p.fullName, p.fullName) })}
        <h2>${name}${p.pronouns ? `<small>${esc(p.pronouns)}</small>` : ''}</h2>
        ${p.headline ? `<p class="headline">${esc(p.headline)}</p>` : ''}
        ${facts.length ? `<p class="facts">${facts.map((f) => `<span>${esc(f)}</span>`).join('')}<span><a href="${esc(p.url)}" rel="noopener" target="_blank" style="color:var(--muted)">linkedin.com/in/${esc(p.publicIdentifier)} ↗</a></span></p>` : ''}
        ${about}
      </div>
      ${experience}${education}${skills}${certs}${languages}${vol}
      ${simple('projects', 'Projects', p.projects)}${simple('honors', 'Honors & awards', p.honors)}${simple('publications', 'Publications', p.publications)}${simple('courses', 'Courses', p.courses)}
    `;
    bindImages(view);
    $('#more')?.addEventListener('click', (e) => { $('#about').dataset.clamped = 'false'; e.target.remove(); });
  }

  // Tokenise the raw JSON first, then escape each token, escaping first would turn quotes into &quot; and break string detection.
  function highlight(json) {
    const re = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\b(?:true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g;
    let out = '', last = 0, m;
    while ((m = re.exec(json))) {
      out += esc(json.slice(last, m.index));
      const t = m[0];
      if (t.startsWith('"')) out += t.endsWith(':') ? `<span class="j-k">${esc(t.slice(0, -1))}</span>:` : `<span class="j-s">${esc(t)}</span>`;
      else if (t === 'null') out += `<span class="j-null">${t}</span>`;
      else if (t === 'true' || t === 'false') out += `<span class="j-b">${t}</span>`;
      else out += `<span class="j-n">${t}</span>`;
      last = m.index + t.length;
    }
    return out + esc(json.slice(last));
  }
  function renderJson(data) {
    const text = JSON.stringify(data, null, 2);
    view.innerHTML = `<div class="json-head"><span>${esc(text.length.toLocaleString())} bytes · application/json</span><button class="copy" type="button" data-copy="#json-src">Copy JSON</button></div><pre class="json" id="json-src">${highlight(text)}</pre>`;
  }

  function renderView() {
    if (!profile) return;
    tab === 'json' ? renderJson(profile) : renderProfile(profile);
  }

  function setStatus(kind, text) { statusEl.hidden = false; statusEl.className = `pill ${kind}`; statusEl.textContent = text; }

  function showLoading() {
    view.innerHTML = `<div class="skel skel-banner"></div><div class="skel-wrap"><div class="skel skel-avatar"></div><div class="skel" style="height:26px;width:40%"></div><div class="skel" style="height:16px;width:70%"></div><div class="skel" style="height:16px;width:30%"></div><div class="skel" style="height:80px;margin-top:12px"></div><div class="skel" style="height:80px"></div></div><p class="cold" id="cold" hidden>Still working, this runs on a free instance that sleeps when idle and can take up to a minute to wake.</p>`;
    setTimeout(() => { const c = $('#cold'); if (c) c.hidden = false; }, 6000);
  }
  function showError(status, body) {
    const e = body?.error ?? { code: `HTTP_${status}`, message: typeof body === 'string' ? body : 'The API returned an unexpected response.' };
    view.innerHTML = `<div class="error"><code>${esc(status)} ${esc(e.code)}</code><p>${esc(e.message)}</p>${e.details ? `<pre class="snippet" style="margin-top:12px">${highlight(JSON.stringify(e.details, null, 2))}</pre>` : ''}</div>`;
  }
  /** A gate the account panel above can clear, in place of the generic error. */
  function showGate(status, code, text) {
    view.innerHTML = `<div class="error"><code>${esc(status)} ${esc(code ?? '')}</code><p>${esc(text)}</p><p style="color:var(--muted)">Use the account panel above, then try again.</p></div>`;
  }

  // ---- account panel
  // One `<aside>` re-rendered from a tiny state machine: loading → signed-out →
  // code → phone → signed-in. Every POST is same-origin JSON, which is what the
  // server's CSRF guard accepts; the session travels in an httpOnly cookie, so
  // there is nothing to keep here but the state name.
  let authState = 'loading', me = null, authMsg = null, authBusy = false, collapsed = false;
  // Remembered so "Resend code" can re-post signup, and so a failed attempt
  // does not wipe what was typed. The password lives in this closure only: it
  // is never rendered into the DOM, stored, or logged, and is dropped the
  // moment a session exists.
  let pendingEmail = '', pendingPassword = '', pendingPhone = '';

  const msgHtml = () => authMsg
    ? `<p class="auth-msg${authMsg.kind === 'note' ? ' note' : ''}" role="${authMsg.kind === 'note' ? 'status' : 'alert'}">${esc(authMsg.text)}</p>`
    : '';

  const AUTH_VIEWS = {
    loading: () => `<span class="skel auth-skel" role="status" aria-label="Checking your session"></span>`,

    'signed-out': () => `
      <p class="auth-title">Sign in to fetch profiles</p>
      <p class="auth-help">Free, and one account per person keeps the demo up.</p>
      <form class="auth-form" data-form="signup">
        <label class="sr" for="auth-email">Email address</label>
        <input id="auth-email" type="email" autocomplete="email" placeholder="you@gmail.com" spellcheck="false" value="${esc(pendingEmail)}" data-focus />
        <label class="sr" for="auth-password">Password</label>
        <input id="auth-password" type="password" autocomplete="current-password" placeholder="Password (10+ characters)" />
        <button class="btn" type="submit">Sign up</button>
        <button class="btn ghost" type="button" data-action="login">Log in</button>
      </form>${msgHtml()}`,

    code: () => `
      <p class="auth-title">Enter your verification code</p>
      <p class="auth-help">We sent six digits to ${esc(pendingEmail)}. It expires in 10 minutes.</p>
      <form class="auth-form" data-form="verify">
        <label class="sr" for="auth-code">Verification code</label>
        <input id="auth-code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" data-focus />
        <button class="btn" type="submit">Verify</button>
        <button class="btn ghost" type="button" data-action="resend">Resend code</button>
      </form>${msgHtml()}`,

    phone: () => `
      <p class="auth-title">Add a phone number</p>
      <p class="auth-help">Used only to keep the demo to one account per person.</p>
      <form class="auth-form" data-form="phone">
        <label class="sr" for="auth-phone">Mobile number</label>
        <input id="auth-phone" type="tel" autocomplete="tel" placeholder="+91 98765 43210" value="${esc(pendingPhone)}" data-focus />
        <button class="btn" type="submit">Add phone</button>
        <button class="btn ghost" type="button" data-action="logout">Log out</button>
      </form>${msgHtml()}`,

    'signed-in': () => `
      <div class="auth-line">
        <span class="pill ok">signed in</span>
        <span class="auth-email">${esc(me?.email ?? '')}</span>
        <span class="spacer"></span>
        <button class="auth-link" type="button" data-action="logout">Log out</button>
        <button class="auth-toggle" type="button" data-action="toggle" aria-expanded="${!collapsed}" aria-controls="auth-detail">
          <span class="sr">Account details</span><span aria-hidden="true">${collapsed ? '▾' : '▴'}</span>
        </button>
      </div>
      <div class="auth-more" id="auth-detail"><div>
        <p class="auth-help" style="margin-bottom:0">Phone linked${me?.createdAt ? ` · member since ${esc(me.createdAt.slice(0, 10))}` : ''}.</p>
      </div></div>${msgHtml()}`,
  };

  function renderAuth(state) {
    if (state) authState = state;
    authEl.classList.toggle('is-collapsed', authState === 'signed-in' && collapsed);
    authEl.innerHTML = AUTH_VIEWS[authState]();
  }
  function setAuth(state, { msg = null, focus = false } = {}) {
    authMsg = msg;
    renderAuth(state);
    if (focus) authEl.querySelector('[data-focus]')?.focus();
  }
  function setAuthMsg(text, kind = 'err') { setAuth(authState, { msg: { text, kind } }); }
  function setAuthBusy(on) {
    authBusy = on;
    for (const b of authEl.querySelectorAll('button')) b.disabled = on;
  }

  /** Every state-changing account call: same-origin JSON, cookie included. */
  async function authPost(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json', accept: 'application/json' },
      body: JSON.stringify(body),
      credentials: 'same-origin',
    });
    const text = await res.text();
    let data = null; try { data = JSON.parse(text); } catch {}
    return { status: res.status, data };
  }

  const retryIn = (s) => s < 90 ? `${s} second${s === 1 ? '' : 's'}` : `${Math.ceil(s / 60)} minutes`;

  /** The server's own wording, escaped on the way in, plus the retry hint. */
  function authFail(status, data) {
    const e = data?.error ?? {};
    let text = e.message || `The request failed (HTTP ${status}).`;
    const retry = e.details?.retryAfterSeconds;
    if (e.code === 'RATE_LIMITED' && typeof retry === 'number') text += ` Try again in ${retryIn(retry)}.`;
    // Two codes are really a change of step, not an error to sit on.
    if (e.code === 'EMAIL_UNVERIFIED' && pendingEmail) return setAuth('code', { msg: { text }, focus: true });
    if (e.code === 'UNAUTHENTICATED') return setAuth('signed-out', { msg: { text }, focus: true });
    setAuthMsg(text);
  }

  /** Where an account lands once the server has told us about it. */
  function applyMe(next, { fromLoad = false } = {}) {
    me = next;
    pendingPassword = '';
    if (next.phoneVerified) { collapsed = fromLoad; setAuth('signed-in'); return; }
    setAuth('phone', { focus: !fromLoad });
  }

  async function authAction(fn) {
    if (authBusy) return;
    setAuthBusy(true);
    try { await fn(); }
    catch { setAuthMsg('Could not reach the server. Check your connection and try again.'); }
    finally { setAuthBusy(false); }
  }

  const ACTIONS = {
    signup: () => authAction(async () => {
      const email = $('#auth-email').value.trim(), password = $('#auth-password').value;
      if (!email || !password) return setAuthMsg('Enter an email address and a password.');
      const { status, data } = await authPost('/auth/signup', { email, password });
      if (status !== 200) return authFail(status, data);
      pendingEmail = email; pendingPassword = password;
      setAuth('code', { msg: { text: 'Code sent. It expires in 10 minutes.', kind: 'note' }, focus: true });
    }),

    login: () => authAction(async () => {
      const email = $('#auth-email').value.trim(), password = $('#auth-password').value;
      if (!email || !password) return setAuthMsg('Enter an email address and a password.');
      pendingEmail = email; pendingPassword = password;
      const { status, data } = await authPost('/auth/login', { email, password });
      if (status !== 200) return authFail(status, data);
      applyMe(data);
    }),

    verify: () => authAction(async () => {
      const code = $('#auth-code').value.trim();
      if (!code) return setAuthMsg('Enter the six-digit code from your email.');
      const { status, data } = await authPost('/auth/verify-email', { email: pendingEmail, code });
      if (status !== 200) return authFail(status, data);
      applyMe(data);
    }),

    resend: () => authAction(async () => {
      if (!pendingEmail || !pendingPassword) {
        return setAuth('signed-out', { msg: { text: 'Enter your email and password again to get a new code.' }, focus: true });
      }
      const { status, data } = await authPost('/auth/signup', { email: pendingEmail, password: pendingPassword });
      if (status !== 200) return authFail(status, data);
      setAuthMsg('New code sent. The older one no longer works.', 'note');
    }),

    phone: () => authAction(async () => {
      const phone = $('#auth-phone').value.trim();
      if (!phone) return setAuthMsg('Enter a mobile number, including the country code.');
      pendingPhone = phone;
      const { status, data } = await authPost('/auth/phone', { phone });
      if (status !== 200) return authFail(status, data);
      pendingPhone = '';
      applyMe(data);
    }),

    logout: () => authAction(async () => {
      const { status, data } = await authPost('/auth/logout', {});
      if (status !== 200) return authFail(status, data);
      me = null; pendingPassword = ''; pendingPhone = '';
      setAuth('signed-out', { msg: { text: 'Signed out.', kind: 'note' } });
    }),

    toggle: () => { collapsed = !collapsed; renderAuth(); },
  };

  /** Opens the panel where a rejected API call says the caller has to act. */
  function openAuth(state) {
    // Someone part-way through the code step keeps their place: dropping them
    // back to the sign-up form would throw away the address the code went to.
    if (state === 'signed-out' && authState === 'code') return;
    collapsed = false;
    setAuth(state, { focus: true });
  }

  async function loadAuth() {
    try {
      const res = await fetch('/auth/me', { headers: { accept: 'application/json' }, credentials: 'same-origin' });
      if (res.status === 200) return applyMe(await res.json(), { fromLoad: true });
      if (res.status === 401) return setAuth('signed-out');
      const data = await res.json().catch(() => null);
      setAuth('signed-out');
      authFail(res.status, data);
    } catch {
      setAuth('signed-out');
    }
  }

  authEl.addEventListener('submit', (e) => { e.preventDefault(); ACTIONS[e.target.dataset.form]?.(); });
  authEl.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (btn) ACTIONS[btn.dataset.action]?.();
  });

  async function lookup(url) {
    url = url.trim();
    if (!url) { input.focus(); return; }
    input.value = url;
    const q = `/v1/profile?url=${encodeURIComponent(url)}`;
    history.replaceState(null, '', `?url=${encodeURIComponent(url)}`);

    profile = null; go.disabled = true; setStatus('busy', 'fetching'); tabsEl.hidden = true; showLoading();
    const t0 = performance.now();
    try {
      const res = await fetch(q, { headers: { accept: 'application/json' } });
      const text = await res.text();
      let body; try { body = JSON.parse(text); } catch { body = text; }
      const ms = Math.round(performance.now() - t0);
      if (!res.ok) {
        setStatus('err', `${res.status} · ${ms} ms`);
        const code = body?.error?.code;
        // The two gates the account panel can clear are shown as a next step,
        // not as a failure: say what to do, and open the panel on that step.
        if (res.status === 401) { showGate(res.status, code, 'Sign in to fetch profiles'); openAuth('signed-out'); return; }
        if (res.status === 403 && code === 'PHONE_REQUIRED') { showGate(res.status, code, 'Add a phone number to fetch profiles'); openAuth('phone'); return; }
        showError(res.status, body);
        return;
      }
      profile = body; setStatus('ok', `200 · ${ms} ms${body.meta?.cached ? ' · cached' : ''}`); tabsEl.hidden = false; renderView();
    } catch (err) {
      setStatus('err', 'network error'); showError('-', { error: { code: 'NETWORK', message: String(err.message || err) } });
    } finally { go.disabled = false; }
  }

  // ---- wiring
  form.addEventListener('submit', (e) => { e.preventDefault(); lookup(input.value); });
  document.querySelectorAll('[role=tab]').forEach((b) => b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('[role=tab]').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
    renderView();
  }));
  document.addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-copy]'); if (!btn) return;
    const src = $(btn.dataset.copy); if (!src) return;
    try { await navigator.clipboard.writeText(src.innerText); btn.dataset.done = 'true'; btn.textContent = 'Copied'; setTimeout(() => { btn.dataset.done = 'false'; btn.textContent = btn.dataset.copy === '#json-src' ? 'Copy JSON' : 'Copy'; }, 1500); } catch {}
  });

  renderAuth('loading');
  loadAuth();

  const initial = new URLSearchParams(location.search).get('url');
  if (initial) lookup(initial); else input.focus();
})();
</script>
</body>
</html>
